<svg viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg" fill="none">

  <!-- Lance — extends well above and below ellipse -->
  <line x1="299" y1="138" x2="299" y2="400" 
        stroke="#1a0d2e" stroke-width="14" stroke-linecap="square"/>
  
  <!-- Gold crossbar -->
  <line x1="252" y1="195" x2="346" y2="195" 
        stroke="#c9930a" stroke-width="13" stroke-linecap="square"/>
  
  <!-- Main large arc: from lower right cut end, going CCW (left/top/left) to upper right cut start -->
  <path d="M 412 333 A 140 88 -10 1 1 396 210" 
        stroke="#1a0d2e" stroke-width="14" fill="none" stroke-linecap="round"/>
  
  <!-- Small arc between the two cuts -->
  <path d="M 432 252 A 140 88 -10 0 1 435 282" 
        stroke="#1a0d2e" stroke-width="14" fill="none" stroke-linecap="round"/>

  <!-- Diamond — gold -->
  <rect x="280" y="280" width="38" height="38" 
        transform="rotate(45 299 299)" fill="#c9930a"/>
  <!-- Diamond cutout — transparent -->
  <rect x="289" y="289" width="20" height="20" 
        transform="rotate(45 299 299)" fill="none" stroke="#c9930a" stroke-width="0"/>
  <!-- Use background color for cutout — works on both light and dark with CSS var -->
  <rect x="289" y="289" width="20" height="20" 
        transform="rotate(45 299 299)" fill="transparent"/>
</svg>
